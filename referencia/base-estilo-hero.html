<title>Hotel Vitae — Base de estilo</title>

<style>
  :root{
    --color-primary:#147ca9;
    --color-primary-dark:#0f6289;
    --color-primary-soft:#e3f3fa;
    --color-primary-border:#7cc4e0;
    --color-background:#f4f8fb;
    --color-surface:#ffffff;
    --color-border:#c9dce8;
    --color-text-primary:#0d1f2d;
    --color-text-secondary:#4a6070;
    --color-text-muted:#8aa3b1;
    --shadow-sm:0 1px 2px rgba(20,124,169,.07);
    --shadow-md:0 4px 8px rgba(20,124,169,.1);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:Archivo,sans-serif;background:var(--color-background);color:var(--color-text-primary);}
  header{display:flex;justify-content:space-between;align-items:center;padding:20px 48px;background:var(--color-surface);border-bottom:1px solid var(--color-border);}
  .logo{display:flex;align-items:center;gap:10px;font-family:Lora,serif;font-size:1.25rem;font-weight:600;}
  .logo svg{width:26px;height:26px;}
  .btn-primary{background:var(--color-primary);color:#fff;border:none;padding:10px 20px;border-radius:6px;font-family:Archivo,sans-serif;font-size:.95rem;font-weight:500;cursor:pointer;}
  .btn-primary:hover{background:var(--color-primary-dark);}
  .hero{padding:64px 48px;}
  .badge{display:inline-block;background:var(--color-primary-soft);color:var(--color-primary-dark);border:1px solid var(--color-primary-border);padding:6px 14px;border-radius:999px;font-size:.85rem;font-weight:500;margin-bottom:20px;}
  h1{font-family:Lora,serif;font-size:2.6rem;font-weight:600;line-height:1.25;margin:0 0 20px;max-width:560px;}
  p.lead{color:var(--color-text-secondary);max-width:520px;line-height:1.6;font-size:1.02rem;}
  .note{display:flex;gap:10px;background:var(--color-surface);border:1px solid var(--color-border);border-radius:8px;padding:16px 18px;margin-top:24px;max-width:560px;box-shadow:var(--shadow-sm);color:var(--color-text-secondary);font-size:.92rem;}
</style>
